name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov  # Added pytest-cov for coverage tracking
        
    - name: Run tests
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        # Added --cov=. to scan your file structure and --cov-report=xml for Codecov consumption
        pytest tests/ --cov=. --cov-report=xml --junitxml=reports/junit/test-results.xml
        
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: reports/junit/test-results.xml

    - name: Upload Coverage Reports to Codecov
      if: always()  # Ensures coverage uploads even if some tests fail, giving you visibility
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false  